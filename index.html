<!DOCTYPE html>
<html>
<head>
    <title>GMPL Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>GMPL Management Dashboard</h1>

<div class="kpi-container">

    <div class="card">
        <h3>Total PO</h3>
        <p id="po">0</p>
    </div>

    <div class="card">
        <h3>RC Released</h3>
        <p id="rc">0</p>
    </div>

    <div class="card">
        <h3>Production Qty</h3>
        <p id="production">0</p>
    </div>

    <div class="card">
        <h3>Dispatch Qty</h3>
        <p id="dispatch">0</p>
    </div>

    <div class="card">
        <h3>Open NCR</h3>
        <p id="ncr">0</p>
    </div>

</div>


<div class="section">

<h2>RC Production Status</h2>

<table>

<tr>
<th>RC No</th>
<th>PO Qty</th>
<th>Produced</th>
<th>FG</th>
<th>Dispatch</th>
<th>Balance</th>
</tr>

<tbody id="productionTable">

</tbody>

</table>

</div>


<div class="section">

<h2>Quality Performance</h2>

<table>

<tr>
<th>Month</th>
<th>Supplier Rejection</th>
<th>Machining Rejection</th>
<th>Customer Complaint</th>
</tr>


<tbody id="qualityTable">

</tbody>

</table>

</div>


<script src="dashboard.js"></script>

</body>
</html>
